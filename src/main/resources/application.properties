spring.profiles.active=dev

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Seeding demo users, roles, categories and SLA policies is OFF by default.
# Enable explicitly per profile (dev) or via SEED_ENABLED=true (prod).
application.seed-enabled=${SEED_ENABLED:false}

# SLA scheduled checks (cron, every 5 minutes)
application.sla.check-cron=0 */5 * * * *

# Mail (JavaMailSender is only created when a host is set)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Emails are disabled unless configured
application.email.enabled=${EMAIL_ENABLED:false}
application.email.from=${MAIL_FROM:no-reply@tunidesk.local}
application.email.base-url=${APP_BASE_URL:http://localhost:5173}

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
application.upload.dir=${UPLOAD_DIR:./uploads}

# CORS allowlist (comma-separated origins). Used for both REST and WebSocket.
# Override with CORS_ALLOWED_ORIGINS in prod.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
