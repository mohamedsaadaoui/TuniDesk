# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tunidesk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seed demo users, roles, categories and SLA policies for local dev
application.seed-enabled=true

# Server
server.port=8080

# Uploads
application.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT
application.security.jwt.secret-key=9fQ2mL8xV7tR4kN6pL1sD3gH5jK7mN2pL8vX4zQ9wE6rT1yU3iO7pA5sD9fG8hJ2kM4nB6vC
application.security.jwt.expiration=86400000

# Email (SMTP)
application.email.enabled=${MAIL_ENABLED:false}
application.email.from=${MAIL_FROM:no-reply@tunidesk.local}
application.email.base-url=${APP_BASE_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
