spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Uploads
application.upload.dir=${UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Email (SMTP) - disabled by default; set MAIL_ENABLED=true to activate
application.email.enabled=${MAIL_ENABLED:false}
application.email.from=${MAIL_FROM:no-reply@tunidesk.local}
application.email.base-url=${APP_BASE_URL}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
