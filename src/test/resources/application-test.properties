# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:tunidesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Never fire the SLA cron during tests
application.sla.check-cron=0 0 0 1 1 *

# Seed demo users/categories/SLA policies so integration tests can log in
application.seed-enabled=true

# Uploads go to a temp directory
application.upload.dir=${java.io.tmpdir}/tunidesk-test-uploads

# Emails are disabled during tests
application.email.enabled=false

# JWT (required by JwtService) - valid base64 for HS256
application.security.jwt.secret-key=9fQ2mL8xV7tR4kN6pL1sD3gH5jK7mN2pL8vX4zQ9wE6rT1yU3iO7pA5sD9fG8hJ2kM4nB6vC
application.security.jwt.expiration=3600000

# CORS allowlist used in tests
application.cors.allowed-origins=http://localhost:5173
