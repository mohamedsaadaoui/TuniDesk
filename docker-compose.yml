services:
  postgres:
    image: postgres:17
    container_name: tunidesk-db
    environment:
      POSTGRES_DB: tunidesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tunidesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunidesk-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/tunidesk
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # REQUIRED (no default): must be a valid Base64 string of at least 256 bits.
      # Do not ship a hardcoded secret - generate one and export it before starting.
      #   PowerShell:  $env:JWT_SECRET = [Convert]::ToBase64String((1..64 | ForEach-Object { Get-Random -Minimum 0 -Maximum 256 }))
      #   bash:        export JWT_SECRET=$(openssl rand -base64 48)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a 256-bit Base64 secret}
      UPLOAD_DIR: /data/uploads
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set to the public frontend origin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_BASE_URL}}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tunidesk-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads-data:
